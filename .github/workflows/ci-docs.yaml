name: CI Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**  # If the documentation files changed
      - zensical.toml  # If the Zensical configuration changed
      - uv.lock  # If the dependencies changed (in case docs dependencies were updated)

  pull_request:
    branches: [main]
    paths: [docs/**, zensical.toml, uv.lock]

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: ./.github/workflows/install-uv

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation
        run: uv run zensical build --strict
